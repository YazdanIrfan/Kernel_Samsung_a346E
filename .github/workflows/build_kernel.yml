###############################################################################
# Build A346E Kernel -- Samsung Galaxy A34 5G (a34x), MediaTek mt6877, GKI 6.6
# Pipeline updated for KernelSU-Next & SUSFS v2.2.0
###############################################################################
name: Build A346E Kernel

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: "Choose KernelSU variant"
        required: true
        type: choice
        options:
          - NO-ROOT
          - KSUN
          - KSUN-SUSFS-v2.2.0
        default: KSUN-SUSFS-v2.2.0
      permissive:
        description: "Make SELinux permissive?"
        type: boolean
        required: true
        default: false
      custom_patches:
        description: "Also apply extra patches from patch/*.patch?"
        type: boolean
        required: true
        default: false
  push:
    branches:
      - A346E
      - Game
  pull_request:
    branches:
      - A346E
      - Game

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  G_EXT: ${{ github.workspace }}/external_deps
  KSU_VAR: ${{ github.event.inputs.ksu_variant || (github.event_name == 'push' && 'KSUN-SUSFS-v2.2.0') || 'NO-ROOT' }}
  PERMISSIVE: ${{ github.event.inputs.permissive || 'false' }}
  CUSTOM_PATCH: ${{ github.event.inputs.custom_patches || 'false' }}

jobs:
  # ==========================================================================
  # #1 Checkout & Detect
  # ==========================================================================
  detect:
    name: "#1 Checkout & Detect"
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Detect kernel tree & build options
        id: detect
        run: |
          set -eu
          if [ -f "Kernel-6.6/Makefile" ]; then
            REAL_DIR="Kernel-6.6"
          elif [ -f "kernel-6.6/Makefile" ]; then
            REAL_DIR="kernel-6.6"
          else
            echo "::error::No kernel tree found (looked for Kernel-6.6/ and kernel-6.6/)"; ls -la; exit 1
          fi
          [ -f "$REAL_DIR/arch/arm64/configs/gki_defconfig" ] \
            || { echo "::error::gki_defconfig missing in $REAL_DIR"; exit 1; }

          SEL=$([ "$PERMISSIVE" = "true" ] && echo permissive || echo enforcing)
          CUS=$([ "$CUSTOM_PATCH" = "true" ] && echo custom || echo nocustom)
          if [ ! -f Google-FDO/kernel.afdo ] && [ -d google-FDO ]; then mv google-FDO Google-FDO; fi
          [ -f Google-FDO/kernel.afdo ] || echo "::warning::Google-FDO/kernel.afdo missing"

          echo "kernel tree : $REAL_DIR ($(grep -m1 -E '^VERSION|^PATCHLEVEL|^SUBLEVEL' -A2 "$REAL_DIR/Makefile" | tr '\n' ' '))"
          echo "KSU variant : $KSU_VAR"
          echo "SELinux     : $SEL"
          echo "extra patch : $CUSTOM_PATCH"
          {
            echo "## Build A346E Kernel"
            echo ""
            echo "| option | value |"
            echo "|---|---|"
            echo "| KSU variant | \`${KSU_VAR}\` |"
            echo "| KSUN source | \`KernelSU-Next latest\` |"
            echo "| SUSFS Version | \`v2.2.0\` |"
            echo "| SELinux | \`${SEL}\` |"
            echo "| Extra patches (patch/*.patch) | \`${CUSTOM_PATCH}\` |"
            echo "| Kernel tree | \`${REAL_DIR}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:12}\` |"
            echo ""
            echo "### #1 Checkout & Detect - OK"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # #2 System Prep
  # ==========================================================================
  system-prep:
    name: "#2 System Prep"
    needs: detect
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check runner resources & toolchain
        run: |
          set -eu
          AVAIL=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "CPUs: $(nproc) | RAM: $(free -g | awk '/Mem:/{print $2}') GB | free disk: ${AVAIL} GB"
          if [ "$AVAIL" -lt 10 ]; then
            echo "::error::only ${AVAIL} GB free on / - the kleaf build cannot fit"
            exit 1
          elif [ "$AVAIL" -lt 20 ]; then
            echo "::warning::only ${AVAIL} GB free on / before cleanup, build may run tight"
          fi
          for t in git curl python3 tar xz; do command -v "$t" >/dev/null || { echo "::error::missing $t"; exit 1; }; done
          python3 --version; git --version
          echo "### #2 System Prep - OK (${AVAIL} GB free before cleanup)" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # #3 External Deps (KSU / SUSFS v2.2.0)
  # ==========================================================================
  external-deps:
    name: "#3 External Deps (KSU/SUSFS)"
    needs: system-prep
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check KernelSU-Next source is reachable
        if: env.KSU_VAR != 'NO-ROOT'
        run: |
          set -eu
          if [ "$KSU_VAR" = "KSUN" ]; then
            URL="https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/dev/kernel/setup.sh"
          else
            URL="https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/next/kernel/setup.sh"
          fi
          curl -fsSL --retry 3 "$URL" -o /tmp/setup.sh
          head -n 1 /tmp/setup.sh | grep -q '^#!' || { echo "::error::setup.sh does not look like a script"; exit 1; }
          echo "setup.sh OK ($(wc -l < /tmp/setup.sh) lines) from $URL"

      - name: Fetch & verify SUSFS v2.2.0 repos
        if: env.KSU_VAR == 'KSUN-SUSFS-v2.2.0'
        run: |
          set -eu
          mkdir -p "$G_EXT" && cd "$G_EXT"
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android15-6.6 --depth 1
          MISSING=0
          for f in "susfs4ksu/kernel_patches/fs/susfs.c" \
                   "susfs4ksu/kernel_patches/include/linux/susfs.h" \
                   "susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch" \
                   "susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"; do
            if [ -f "$f" ]; then echo "OK      $f"; else echo "::error::MISSING $f"; MISSING=1; fi
          done
          [ "$MISSING" = "0" ] || exit 1

      - name: Nothing to fetch (NO-ROOT)
        if: env.KSU_VAR == 'NO-ROOT'
        run: echo "NO-ROOT variant - no external dependencies"

      - name: Summary
        if: always()
        run: |
          set -eu
          echo "### #3 External Deps - OK (${KSU_VAR})" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # #4 Patches
  # ==========================================================================
  patches:
    name: "#4 Patches"
    needs: external-deps
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Detect kernel dir
        run: |
          set -eu
          if [ -f "Kernel-6.6/Makefile" ]; then echo "KDIR=Kernel-6.6" >> "$GITHUB_ENV"
          elif [ -f "kernel-6.6/Makefile" ]; then echo "KDIR=kernel-6.6" >> "$GITHUB_ENV"
          else echo "::error::no kernel tree found"; exit 1; fi

      - name: kernel-6.6 patches (always applied)
        run: |
          set -eu
          A="kernel/patches-kernel-6.6/apply.sh"
          [ -f "$A" ] || { echo "::error::$A missing"; exit 1; }
          chmod +x "$A"
          bash "$A" --check "$KDIR"

      - name: Verify in-tree fixes (vendor / device modules)
        run: |
          set -eu
          FAIL=0
          check() {
            if [ -f "$2" ] && grep -q "$3" "$2"; then
              echo "OK      $1"
            else
              echo "::error::MISSING $1  ($2)"; FAIL=1
            fi
          }
          check "SEC_PM Kconfig"           "kernel/kernel_device_modules-6.6/drivers/samsung/pm/Kconfig" "config SEC_PM"
          check "MAX/MIN guard (stp_uart)" "vendor/mediatek/kernel_modules/connectivity/common/common_main/linux/stp_uart.c" "#ifndef MAX"

          check "BTCVSD SCO resync/xrun recovery" "kernel/kernel_device_modules-6.6/sound/soc/mediatek/common/mtk-btcvsd.c" "mtk_btcvsd_snd_band_resync"
          check "BTCVSD rx overrun self-recovery" "kernel/kernel_device_modules-6.6/sound/soc/mediatek/common/mtk-btcvsd.c" "mtk_btcvsd_snd_rx_resync"
          check "BTCVSD silence priming"          "kernel/kernel_device_modules-6.6/sound/soc/mediatek/common/mtk-btcvsd.c" "mtk_btcvsd_snd_silence_prime"

          Z="$KDIR/drivers/block/zram/zram_drv.c"
          if grep -qE '^static const char \*default_compressor = (CONFIG_ZRAM_DEF_COMP|"[a-z0-9-]+");' "$Z"; then
            echo "OK      zram default_compressor is valid C"
          else
            echo "::error::BROKEN zram default_compressor:"; grep -n "default_compressor =" "$Z" || true; FAIL=1
          fi

          if grep -rl --include=*.c --include=*.h "get_current_cred_module\|put_cred_module" vendor 2>/dev/null | grep -q .; then
            echo "::error::get_current_cred_module/put_cred_module still present in vendor/:"
            grep -rl --include=*.c --include=*.h "get_current_cred_module\|put_cred_module" vendor 2>/dev/null | sed 's/^/          /'
            FAIL=1
          else
            echo "OK      no Samsung-only cred API in vendor/ (the modules we build)"
          fi

          [ "$FAIL" = "0" ] || { echo "::error::a fix is missing from the source tree - the build would fail"; exit 1; }

      - name: SELinux permissive patch (PERMISSIVE=true)
        if: env.PERMISSIVE == 'true'
        run: |
          set -eu
          P="Permissive/selinux-make-permissive.patch"
          [ -f "$P" ] || { echo "::error::PERMISSIVE=true but $P is missing"; exit 1; }
          if patch -p1 -d "$KDIR" --dry-run --forward --batch < "$P" > /tmp/perm.log 2>&1; then
            echo "APPLIES $(basename "$P") -> $KDIR"
          elif grep -q "Reversed (or previously applied)" /tmp/perm.log; then
            echo "ALREADY $(basename "$P")"
          else
            echo "::error::permissive patch does not apply"; cat /tmp/perm.log; exit 1
          fi

      - name: Extra patches from patch/*.patch (CUSTOM_PATCH=true)
        if: env.CUSTOM_PATCH == 'true'
        run: |
          set -eu
          shopt -s nullglob
          EXTRA=(patch/*.patch)
          shopt -u nullglob
          if [ ${#EXTRA[@]} -eq 0 ]; then
            echo "::warning::CUSTOM_PATCH=true but patch/ has no *.patch file"
            exit 0
          fi
          FAIL=0
          for p in "${EXTRA[@]}"; do
            base=$(basename "$p")
            if patch -p1 -d "$KDIR" --dry-run --forward --batch < "$p" > /tmp/out.log 2>&1; then
              echo "APPLIES $base -> $KDIR"
            elif grep -q "Reversed (or previously applied)" /tmp/out.log; then
              echo "ALREADY $base"
            else
              echo "::error::BROKEN  $base"; sed 's/^/          /' /tmp/out.log; FAIL=1
            fi
          done
          [ "$FAIL" = "0" ] || exit 1

      - name: Summary
        run: |
          {
            echo "### #4 Patches - OK"
            echo "- kernel-6.6 patches (\`kernel/patches-kernel-6.6/\`): validated"
            echo "- permissive patch: \`${PERMISSIVE}\`"
            echo "- extra patches (\`patch/*.patch\`): \`${CUSTOM_PATCH}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # #5 KernelSU
  # ==========================================================================
  kernelsu:
    name: "#5 KernelSU"
    needs: patches
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Resolve KernelSU-Next version
        id: resolve
        if: env.KSU_VAR != 'NO-ROOT'
        run: |
          set -eu
          REPO=https://github.com/KernelSU-Next/KernelSU-Next.git
          BRANCH=$([ "$KSU_VAR" = "KSUN" ] && echo "dev" || echo "next")
          git clone --branch "$BRANCH" "$REPO" /tmp/ksun >/dev/null 2>&1
          cd /tmp/ksun
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
          CODE=$((30000 + $(git rev-list --count HEAD)))
          SHA=$(git rev-parse --short HEAD)
          {
            echo "ksu_tag=$TAG"; echo "ksu_code=$CODE"; echo "ksu_sha=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "KernelSU-Next $BRANCH: $TAG ($CODE) @ $SHA"

      - name: Defconfig plan
        run: |
          set -eu
          echo "gki_defconfig additions for $KSU_VAR (between the '# >>> a346e-ci' markers):"
          case "$KSU_VAR" in
            KSUN)               echo "  CONFIG_KSU=y, CONFIG_KPROBES=y, CONFIG_KPROBE_EVENTS=y, CONFIG_MODULES=y" ;;
            KSUN-SUSFS-v2.2.0)  echo "  CONFIG_KSU=y, CONFIG_KSU_SUSFS=y (v2.2.0 specific flags)" ;;
            NO-ROOT)            echo "  (none)" ;;
          esac
          {
            echo "### #5 KernelSU - OK"
            echo "- KernelSU-Next: \`${{ steps.resolve.outputs.ksu_tag || 'n/a' }}\` (\`${{ steps.resolve.outputs.ksu_code || 'n/a' }}\`) @ \`${{ steps.resolve.outputs.ksu_sha || 'n/a' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # #6 Build
  # ==========================================================================
  build:
    name: "#6 Build"
    needs: kernelsu
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    outputs:
      image_size: ${{ steps.build.outputs.image_size }}
      image_sha: ${{ steps.build.outputs.image_sha }}
      artifact: ${{ steps.meta.outputs.artifact }}
      selinux: ${{ steps.meta.outputs.selinux }}
      ksu_tag: ${{ steps.ksu.outputs.ksu_tag }}
      ksu_code: ${{ steps.ksu.outputs.ksu_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free disk space
        run: |
          set -eu
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                      /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby || true
          sudo apt-get remove --purge -y '^php.*' '^dotnet-.*' '^mysql-.*' \
                      '^firefox.*' '^mongodb-.*' '^postgresql-.*' azure-cli \
                      google-chrome-stable google-cloud-cli >/dev/null 2>&1 || true
          sudo apt-get autoremove -y >/dev/null 2>&1 || true
          sudo apt-get clean || true

      - name: Install host dependencies
        run: |
          set -eu
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            curl wget unzip git rsync ca-certificates \
            bc bison flex build-essential \
            libssl-dev libelf-dev libncurses-dev dwarves \
            lz4 zstd cpio libxml2-utils xsltproc \
            python3 python3-pip python3-setuptools python3-dev \
            zlib1g-dev libbz2-dev liblz4-dev libzstd-dev
          git config --global user.email "builder@example.com"
          git config --global user.name  "Builder"
          git config --global --add safe.directory "*"

      - name: Set kernel dir & artifact name
        id: meta
        run: |
          set -eu
          if [ -f "Kernel-6.6/Makefile" ]; then REAL_DIR=Kernel-6.6
          elif [ -f "kernel-6.6/Makefile" ]; then REAL_DIR=kernel-6.6
          else echo "::error::no kernel tree found"; exit 1; fi
          echo "REAL_DIR=$REAL_DIR" >> "$GITHUB_ENV"
          echo "G_KERNEL=$GITHUB_WORKSPACE/$REAL_DIR" >> "$GITHUB_ENV"
          SEL=$([ "$PERMISSIVE" = "true" ] && echo permissive || echo enforcing)
          CUS=$([ "$CUSTOM_PATCH" = "true" ] && echo custom || echo nocustom)
          echo "selinux=$SEL" >> "$GITHUB_OUTPUT"
          echo "artifact=kernel-image-${KSU_VAR}-${SEL}-${CUS}" >> "$GITHUB_OUTPUT"

      - name: External deps (SUSFS v2.2.0 only)
        if: env.KSU_VAR == 'KSUN-SUSFS-v2.2.0'
        run: |
          set -eu
          mkdir -p "$G_EXT" && cd "$G_EXT"
          [ -d susfs4ksu ] || git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android15-6.6 --depth 1

      - name: SUSFS v2.2.0 kernel patches
        if: env.KSU_VAR == 'KSUN-SUSFS-v2.2.0'
        run: |
          set -eu
          SUSFS_DIR="$G_EXT/susfs4ksu"
          cp -v "$SUSFS_DIR"/kernel_patches/include/linux/* "$G_KERNEL/include/linux/" || true
          cp -v "$SUSFS_DIR"/kernel_patches/fs/*            "$G_KERNEL/fs/"            || true
          cd "$G_KERNEL"
          
          PATCH_FILE="$SUSFS_DIR/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch"
          echo "--- Applying $(basename "$PATCH_FILE")"
          patch -p1 --forward --batch < "$PATCH_FILE" || echo "::warning::$(basename "$PATCH_FILE") failed or partially applied"

          grep -rl "protected_exports_list" --include="BUILD.bazel" "$GITHUB_WORKSPACE/$REAL_DIR" 2>/dev/null | while read -r f; do
            sed -i '/"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",\?/d' "$f"
          done
          find "$GITHUB_WORKSPACE/$REAL_DIR" -iname "abi_gki_protected_exports*" -type f -delete 2>/dev/null || true

      - name: Add KernelSU-Next
        id: ksu
        if: env.KSU_VAR != 'NO-ROOT'
        run: |
          set -eu
          cd "$G_KERNEL"
          rm -rf KernelSU-Next
          case "$KSU_VAR" in
            KSUN)
              curl -LSs --retry 3 https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/dev/kernel/setup.sh -o /tmp/ksun_setup.sh
              sh /tmp/ksun_setup.sh dev
              ;;
            KSUN-SUSFS-v2.2.0)
              curl -LSs --retry 3 https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/next/kernel/setup.sh -o /tmp/ksun_setup.sh
              sh /tmp/ksun_setup.sh next
              
              SUS_PATCH="$G_EXT/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
              echo "--- Applying SUSFS v2.2.0 patch to KernelSU-Next"
              patch -p1 -d ./KernelSU-Next --forward --batch < "$SUS_PATCH" || echo "::warning::10_enable_susfs_for_ksu.patch failed or already applied"
              ;;
          esac
          [ -d KernelSU-Next ] || { echo "::error::KernelSU-Next missing after setup.sh"; exit 1; }

          cd KernelSU-Next
          KSU_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
          KSU_CODE=$((30000 + $(git rev-list --count HEAD 2>/dev/null || echo 0)))
          KSU_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
          if [ -f kernel/Kbuild ] && grep -q KSU_VERSION_FALLBACK kernel/Kbuild; then
            sed -i "s|^KSU_VERSION_FALLBACK := .*|KSU_VERSION_FALLBACK := ${KSU_CODE}|"        kernel/Kbuild
            sed -i "s|^KSU_VERSION_TAG_FALLBACK := .*|KSU_VERSION_TAG_FALLBACK := ${KSU_TAG}|" kernel/Kbuild
          fi
          { echo "KSU_GIT_TAG=$KSU_TAG"; echo "KSU_VERSION=$KSU_CODE"; echo "KSU_COMMIT=$KSU_SHA"; } >> "$GITHUB_ENV"
          { echo "ksu_tag=$KSU_TAG"; echo "ksu_code=$KSU_CODE"; } >> "$GITHUB_OUTPUT"

      - name: Defconfig (KSU + IPSet)
        run: |
          set -eu
          DEFCONFIG="$G_KERNEL/arch/arm64/configs/gki_defconfig"
          sed -i '/^# >>> a346e-ci$/,/^# <<< a346e-ci$/d' "$DEFCONFIG"
          echo "# >>> a346e-ci" >> "$DEFCONFIG"

          case "$KSU_VAR" in
            KSUN)
              cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_MODULES=y
          EOF
              ;;
            KSUN-SUSFS-v2.2.0)
              cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_KSU=y
          CONFIG_MODULES=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          EOF
              ;;
          esac

          cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          EOF
          echo "# <<< a346e-ci" >> "$DEFCONFIG"

      - name: Build kernel
        id: build
        run: |
          set -eu
          chmod +x ./build_kernel.sh
          if ! bash ./build_kernel.sh 2>&1 | tee build.log; then
            echo "::error::build_kernel.sh failed - see the build-log artifact"
            tail -n 60 build.log || true
            exit 1
          fi
          [ -f Image ] || { echo "::error::Image not produced"; find out -name Image -type f | head; exit 1; }
          echo "image_size=$(du -h Image | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "image_sha=$(sha256sum Image | cut -c1-16)"    >> "$GITHUB_OUTPUT"
          ls -lh Image

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: Image
          if-no-files-found: error
          compression-level: 6

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: build.log
          if-no-files-found: warn

  # ==========================================================================
  # #7 Upload & Summary
  # ==========================================================================
  upload-summary:
    name: "#7 Upload & Summary"
    needs: build
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Report
        run: |
          set -eu
          {
            echo "### #7 Result: \`${{ needs.build.result }}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| KSU variant | \`${KSU_VAR}\` |"
            echo "| KernelSU-Next | \`${{ needs.build.outputs.ksu_tag || 'n/a' }}\` (\`${{ needs.build.outputs.ksu_code || 'n/a' }}\`) |"
            echo "| SELinux | \`${{ needs.build.outputs.selinux || env.PERMISSIVE }}\` |"
            echo "| Image | \`${{ needs.build.outputs.image_size || 'n/a' }}\` sha256:\`${{ needs.build.outputs.image_sha || 'n/a' }}\` |"
            echo "| Artifact | \`${{ needs.build.outputs.artifact || 'n/a' }}\` |"
            echo ""
            echo "Pipeline: #1 ●──● #2 ●──● #3 ●──● #4 ●──● #5 ●──● #6 ●──● #7"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue on failure
        if: needs.build.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cat > issue.md <<EOF
          Build failed: [run ${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          | field | value |
          |---|---|
          | commit | \`${{ github.sha }}\` |
          | branch | \`${{ github.ref_name }}\` |
          | KSU | \`${KSU_VAR}\` |
          | permissive | \`${PERMISSIVE}\` |
          | extra patches | \`${CUSTOM_PATCH}\` |

          The \`build-log-${{ github.run_id }}\` artifact has the full build log.
          EOF
          gh issue create --title "Build failed #${{ github.run_id }} [${KSU_VAR}]" --body-file issue.md || true
